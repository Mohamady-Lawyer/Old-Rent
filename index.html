<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>حاسبة إيجار القانون القديم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  font-family: "Space Grotesk", "Segoe UI", Tahoma, Arial, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
}

:root {
  /* Light mode (default) — warm ivory, professional */
  --bg-page: #f6f3ec;
  --card-grad-1: #fffdf8;
  --card-grad-2: #f6f3ec;
  --card-border: #e2d9c3;
  --top-glow: #185fa5;
  --title-color: #1c2b3a;
  --icon-bg: #fffdf8;
  --icon-border: #e2d9c3;
  --icon-color: #185fa5;
  --input-bg: #fffdf8;
  --input-border: #e2d9c3;
  --input-focus-border: #185fa5;
  --input-focus-ring: rgba(24, 95, 165, 0.12);
  --label-color: #8a7f66;
  --input-text: #23201a;
  --divider-color: #e2d9c3;
  --result-grad-1: rgba(24, 95, 165, 0.1);
  --result-grad-2: rgba(24, 95, 165, 0.03);
  --result-border: rgba(24, 95, 165, 0.3);
  --result-label-color: #185fa5;
  --result-value-color: #1c2b3a;
  --result-value-glow: rgba(24, 95, 165, 0.15);
  --switch-bg: #efe9db;
  --switch-border: #e2d9c3;
  --mode-text: #8a7f66;
  --mode-active-bg: rgba(24, 95, 165, 0.1);
  --mode-active-text: #185fa5;
  --mode-active-ring: rgba(24, 95, 165, 0.3);

  --accent-1: #185fa5;
  --accent-2: #0d3f70;
  --gold: #c9a84c;
  --muted: #8a7f66;
  --danger: #a32d2d;
  --error-bg: #fbe9e9;
}

html {
  background: #f6f3ec;
}

html:has(body.dark) {
  background: #05070a;
}

body {
  background: var(--bg-page);
  color: var(--input-text);
  transition: background 0.2s ease, color 0.2s ease;
  min-height: 100vh;
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
}

body.dark {
  /* Dark mode — royal blue / gold, professional & rich */
  --bg-page: #05070a;
  --card-grad-1: #0d1420;
  --card-grad-2: #0a0f18;
  --card-border: #1e2a3d;
  --top-glow: #d4af37;
  --title-color: #eef2f8;
  --icon-bg: #0f1826;
  --icon-border: #1e2a3d;
  --icon-color: #d4af37;
  --input-bg: #0a0f18;
  --input-border: #1e2a3d;
  --input-focus-border: #4a90d9;
  --input-focus-ring: rgba(74, 144, 217, 0.1);
  --label-color: #6b7a90;
  --input-text: #eef2f8;
  --divider-color: #1e2a3d;
  --result-grad-1: rgba(74, 144, 217, 0.12);
  --result-grad-2: rgba(74, 144, 217, 0.03);
  --result-border: rgba(74, 144, 217, 0.3);
  --result-label-color: #d4af37;
  --result-value-color: #eef2f8;
  --result-value-glow: rgba(74, 144, 217, 0.3);
  --switch-bg: #0a0f18;
  --switch-border: #1e2a3d;
  --mode-text: #6b7a90;
  --mode-active-bg: rgba(74, 144, 217, 0.12);
  --mode-active-text: #4a90d9;
  --mode-active-ring: rgba(74, 144, 217, 0.35);

  --accent-1: #4a90d9;
  --accent-2: #d4af37;
  --gold: #d4af37;
  --muted: #6b7a90;
  --danger: #ff6b5b;
  --error-bg: #3a1616;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.page-title {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--title-color);
  letter-spacing: 0.02em;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--icon-border);
  background: var(--icon-bg);
  cursor: pointer;
  font-size: 15px;
  border-radius: 8px;
  color: var(--icon-color);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.icon-btn:hover {
  border-color: var(--icon-color);
  box-shadow: 0 0 8px var(--result-border);
}

/* ===== Lawyer info box ===== */
.lawyer-box {
  position: relative;
  background: linear-gradient(135deg, var(--card-grad-1) 0%, var(--card-grad-2) 100%);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.18);
}

.lawyer-box::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.lawyer-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
  margin-bottom: 3px;
}

.lawyer-title {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.lawyer-phone {
  font-size: 13px;
  font-weight: 600;
  font-family: "JetBrains Mono", monospace;
  color: var(--accent-1);
  direction: ltr;
  display: inline-block;
  letter-spacing: 0.03em;
}

/* ===== Glassy card shell ===== */
.card {
  position: relative;
  background: linear-gradient(180deg, var(--card-grad-1) 0%, var(--card-grad-2) 100%);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 16px;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--top-glow), transparent);
  opacity: 0.6;
}

.field {
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--label-color);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}

.field input {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  font-family: "JetBrains Mono", monospace;
  text-align: center;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--input-text);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  outline: none;
}

.field input[type="number"] {
  direction: ltr;
}

.field input:focus {
  border-color: var(--input-focus-border);
  box-shadow: 0 0 0 3px var(--input-focus-ring);
}

.field input:hover {
  border-color: var(--accent-1);
}

.choice-group {
  display: flex;
  gap: 8px;
}

.choice-btn {
  flex: 1;
  padding: 10px 4px;
  font-size: 12.5px;
  border: 1px solid var(--switch-border);
  border-radius: 9px;
  background: var(--switch-bg);
  color: var(--mode-text);
  cursor: pointer;
  transition: all 0.15s ease;
}

.choice-btn:hover {
  border-color: var(--accent-1);
}

.choice-btn.active {
  border-color: var(--accent-1);
  background: var(--mode-active-bg);
  color: var(--mode-active-text);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--mode-active-ring);
}

.calc-btn {
  width: 100%;
  padding: 13px;
  margin-top: 4px;
  margin-bottom: 4px;
  background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  color: #ffffff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 16px var(--result-border);
  transition: opacity 0.15s ease, transform 0.1s ease;
}

.calc-btn:hover {
  opacity: 0.92;
}

.calc-btn:active {
  transform: translateY(1px);
}

.error-box {
  background: var(--error-bg);
  color: var(--danger);
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 8px;
  margin-top: 14px;
}

.info-box {
  background: var(--result-grad-1);
  border: 1px solid var(--result-border);
  color: var(--label-color);
  font-size: 13px;
  padding: 12px 14px;
  border-radius: 10px;
  text-align: center;
  line-height: 1.6;
  margin-top: 14px;
}

.result-box {
  background: linear-gradient(135deg, var(--result-grad-1), var(--result-grad-2));
  border: 1px solid var(--result-border);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  margin-top: 14px;
}

.result-label {
  font-size: 11px;
  color: var(--result-label-color);
  margin: 0 0 6px;
  letter-spacing: 0.02em;
}

.result-value {
  font-size: 21px;
  font-weight: 700;
  font-family: "JetBrains Mono", monospace;
  margin: 0;
  color: var(--result-value-color);
  text-shadow: 0 0 10px var(--result-value-glow);
}

.result-sub {
  font-size: 10.5px;
  color: var(--muted);
  margin: 6px 0 0;
  line-height: 1.5;
}

.hidden {
  display: none;
}
</style>
</head>
<body class="dark">
<div class="container">
  <div class="page-header">
    <span class="page-title">حاسبة إيجار القانون القديم</span>
    <button id="darkToggle" class="icon-btn" title="الوضع الليلي">☀️</button>
  </div>

  <div class="lawyer-box">
    <div class="lawyer-name">أسامة محمدي</div>
    <div class="lawyer-title">المحامي بالإستئناف العالي ومجلس الدولة</div>
    <div class="lawyer-phone">01006569629</div>
  </div>

  <div class="card">
    <div class="field">
      <label for="contractDate">تاريخ بداية التعاقد</label>
      <input type="date" id="contractDate">
    </div>

    <div class="field">
      <label for="startRent">الأجرة الأصلية وقت التعاقد (جنيه)</label>
      <input type="number" id="startRent" step="any" placeholder="مثال: 3" inputmode="decimal">
    </div>

    <div class="field">
      <label>نوع الاستخدام</label>
      <div class="choice-group" id="usageGroup">
        <button type="button" class="choice-btn active" data-value="residential">سكني</button>
        <button type="button" class="choice-btn" data-value="commercial">تجاري</button>
      </div>
    </div>

    <div class="field" id="tierField">
      <label>فئة السكن</label>
      <div class="choice-group" id="tierGroup">
        <button type="button" class="choice-btn" data-value="economic" data-min="250" data-multiplier="10">اقتصادي</button>
        <button type="button" class="choice-btn active" data-value="medium" data-min="400" data-multiplier="10">متوسط</button>
        <button type="button" class="choice-btn" data-value="premium" data-min="1000" data-multiplier="20">متميز</button>
      </div>
    </div>

    <button id="calcBtn" class="calc-btn">احسب الأجرة الحالية</button>

    <div id="errorBox" class="error-box hidden"></div>
    <div id="infoBox" class="info-box hidden"></div>

    <div id="resultsWrap" class="hidden">
      <div class="result-box">
        <p class="result-label">أجرة أول تطبيق</p>
        <p id="baseRentValue" class="result-value">—</p>
        <p id="baseRentSub" class="result-sub"></p>
      </div>

      <div class="result-box">
        <p class="result-label">الأجرة المستحقة حالياً</p>
        <p id="currentRentValue" class="result-value">—</p>
        <p id="currentRentSub" class="result-sub"></p>
      </div>

      <div class="result-box">
        <p class="result-label">الأجرة بعد الزيادة القادمة</p>
        <p id="nextRentValue" class="result-value">—</p>
        <p id="nextRentSub" class="result-sub"></p>
      </div>
    </div>
  </div>
</div>

<script>
const darkToggle = document.getElementById('darkToggle');
const calcBtn = document.getElementById('calcBtn');
const errorBox = document.getElementById('errorBox');
const infoBox = document.getElementById('infoBox');
const resultsWrap = document.getElementById('resultsWrap');
const baseRentValue = document.getElementById('baseRentValue');
const baseRentSub = document.getElementById('baseRentSub');
const currentRentValue = document.getElementById('currentRentValue');
const currentRentSub = document.getElementById('currentRentSub');
const nextRentValue = document.getElementById('nextRentValue');
const nextRentSub = document.getElementById('nextRentSub');
const tierField = document.getElementById('tierField');
const usageGroup = document.getElementById('usageGroup');
const tierGroup = document.getElementById('tierGroup');

function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  darkToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}
const savedTheme = localStorage.getItem('oldRentTheme');
applyTheme(savedTheme === 'light' ? 'light' : 'dark');
darkToggle.addEventListener('click', () => {
  const isDark = document.body.classList.contains('dark');
  const newTheme = isDark ? 'light' : 'dark';
  applyTheme(newTheme);
  localStorage.setItem('oldRentTheme', newTheme);
});

const fieldOrder = ['contractDate', 'startRent'];
fieldOrder.forEach((id, index) => {
  const el = document.getElementById(id);
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const isLast = index === fieldOrder.length - 1;
    if (isLast) {
      calcBtn.click();
    } else {
      document.getElementById(fieldOrder[index + 1]).focus();
    }
  });
});

let usageValue = 'residential';
let tierValue = 'medium';

function selectChoice(group, btn, onSelect) {
  Array.from(group.children).forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  onSelect(btn.dataset.value);
}

usageGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.choice-btn');
  if (!btn) return;
  selectChoice(usageGroup, btn, (v) => {
    usageValue = v;
    tierField.classList.toggle('hidden', v === 'commercial');
  });
});

tierGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.choice-btn');
  if (!btn) return;
  selectChoice(tierGroup, btn, (v) => { tierValue = v; });
});

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
  infoBox.classList.add('hidden');
  resultsWrap.classList.add('hidden');
}
function clearMessages() {
  errorBox.classList.add('hidden');
  infoBox.classList.add('hidden');
  resultsWrap.classList.add('hidden');
}

function calcFullYearsBetween(startDate, today) {
  let years = today.getFullYear() - startDate.getFullYear();
  const anniversaryPassed =
    today.getMonth() > startDate.getMonth() ||
    (today.getMonth() === startDate.getMonth() && today.getDate() >= startDate.getDate());
  if (!anniversaryPassed) years -= 1;
  return Math.max(years, 0);
}

calcBtn.addEventListener('click', () => {
  clearMessages();

  const dateStr = document.getElementById('contractDate').value;
  const startRentStr = document.getElementById('startRent').value;

  if (!dateStr) {
    showError('من فضلك أدخل تاريخ بداية التعاقد');
    return;
  }
  if (startRentStr === '' || isNaN(Number(startRentStr)) || Number(startRentStr) <= 0) {
    showError('من فضلك أدخل قيمة صحيحة للأجرة الأصلية');
    return;
  }

  const contractDate = new Date(dateStr);
  const cutoffDate = new Date('1996-01-30');
  const today = new Date();

  if (contractDate > today) {
    showError('تاريخ التعاقد لا يمكن أن يكون في المستقبل');
    return;
  }

  if (contractDate > cutoffDate) {
    infoBox.textContent = 'هذا العقد غير خاضع لقانون الإيجار القديم، حيث إن تاريخ التعاقد بعد آخر تاريخ لتطبيقه (30/1/1996).';
    infoBox.classList.remove('hidden');
    return;
  }

  const startRent = Number(startRentStr);

  let baseRent;
  let baseNote;
  if (usageValue === 'commercial') {
    baseRent = startRent * 5;
    baseNote = 'أجرة تجارية = الأجرة الأصلية × 5';
  } else {
    const selectedTierBtn = tierGroup.querySelector('.choice-btn.active');
    const minRent = Number(selectedTierBtn.dataset.min);
    const multiplier = Number(selectedTierBtn.dataset.multiplier);
    const tierLabel = selectedTierBtn.textContent.trim();
    const computed = startRent * multiplier;
    baseRent = Math.max(computed, minRent);
    if (computed < minRent) {
      baseNote = 'الأجرة الأصلية × ' + multiplier + ' = ' + computed.toFixed(2) + '، أقل من الحد الأدنى لفئة ' + tierLabel + ' (' + minRent + ' جنيه)، فطُبّق الحد الأدنى';
    } else {
      baseNote = 'الأجرة الأصلية × ' + multiplier + ' = ' + computed.toFixed(2) + '، أعلى من الحد الأدنى لفئة ' + tierLabel + '، فطُبّقت كما هي';
    }
  }

  const firstApplicationDate = new Date(2025, 8, 1);

  baseRentValue.textContent = baseRent.toLocaleString('ar-EG', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + ' جنيه';
  baseRentSub.textContent = baseNote + ' — تُطبق اعتباراً من 1/9/2025 (تاريخ نفاذ القانون)';

  const dueDay = contractDate.getDate();
  const firstIncreaseDate = new Date(2026, 8, dueDay);

  const rate = 0.15;
  let years = 0;
  if (today >= firstIncreaseDate) {
    years = calcFullYearsBetween(firstIncreaseDate, today) + 1;
  }
  const currentRent = baseRent * Math.pow(1 + rate, years);

  currentRentValue.textContent = currentRent.toLocaleString('ar-EG', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + ' جنيه';

  const fDay = String(firstIncreaseDate.getDate()).padStart(2, '0');
  if (today < firstIncreaseDate) {
    currentRentSub.textContent = 'لم تحن أول زيادة سنوية بعد (تُطبق ' + fDay + '/9/2026)';
  } else {
    const lastIncrease = new Date(firstIncreaseDate);
    lastIncrease.setFullYear(firstIncreaseDate.getFullYear() + years - 1);
    const lDay = String(lastIncrease.getDate()).padStart(2, '0');
    const lMonth = String(lastIncrease.getMonth() + 1).padStart(2, '0');
    const lYear = lastIncrease.getFullYear();
    currentRentSub.textContent = 'بعد ' + years + ' زيادة سنوية — آخر زيادة بتاريخ ' + lDay + '/' + lMonth + '/' + lYear;
  }

  const nextIncreaseDate = new Date(firstIncreaseDate);
  nextIncreaseDate.setFullYear(firstIncreaseDate.getFullYear() + years);
  const nextRent = baseRent * Math.pow(1 + rate, years + 1);

  nextRentValue.textContent = nextRent.toLocaleString('ar-EG', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + ' جنيه';
  const nDay = String(nextIncreaseDate.getDate()).padStart(2, '0');
  const nMonth = String(nextIncreaseDate.getMonth() + 1).padStart(2, '0');
  const nYear = nextIncreaseDate.getFullYear();
  nextRentSub.textContent = 'تُطبق اعتباراً من ' + nDay + '/' + nMonth + '/' + nYear;

  resultsWrap.classList.remove('hidden');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
